<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadMind - Video</title>

<style>
    /* =========================================================
       VARIABLES DE CONFIGURACIÓN (¡Modifica estos valores!)
       ========================================================= */
    :root {
        /* 1. TAMAÑO DEL VIDEO: Cambia "270px" por un número mayor para agrandarlo (ej: 350px, 400px o 100%) */
        --ancho-video: 400px; 

        /* 2. POSICIÓN DE LA BARRA: Cambia "26px" para moverla. 
           - Más grande (ej: 50px) para bajarla más.
           - Cero o negativo (ej: 0px o -40px) para subirla e incluso ponerla encima del video. */
        --distancia-barra: 40px;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #00348A;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 20px 16px;
    }

    /* Contenedor principal ajustado con la variable */
    .player {
        width: min(100%, var(--ancho-video));
    }

    /* Área blanca donde se reproduce el video */
    .video-container {
        width: 100%;
        aspect-ratio: 9 / 16;
        background: #FFFFFF;
        border-radius: 19px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
    }

    video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #FFFFFF;
    }

    /* Barra de progreso ajustada con la variable */
    .progress-area {
        margin-top: var(--distancia-barra);
        width: 100%;
        position: relative;
        z-index: 10;
    }

    .progress {
        width: 100%;
        height: 4px;
        display: block;
        margin: 0;
        padding: 0;
        appearance: none;
        -webkit-appearance: none;
        background: #D2D2D2;
        border-radius: 0;
        outline: none;
        cursor: pointer;
    }

    /* Chrome / Edge / Safari */
    .progress::-webkit-slider-runnable-track {
        height: 3px;
        background: linear-gradient(
            to right,
            #0878FF 0%,
            #0878FF var(--progress, 0%),
            #D2D2D2 var(--progress, 0%),
            #D2D2D2 100%
        );
    }

    .progress::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 17px;
        height: 17px;
        margin-top: -7px;
        border: none;
        border-radius: 50%;
        background: #0878FF;
        cursor: grab;
    }

    .progress::-webkit-slider-thumb:active {
        cursor: grabbing;
    }

    /* Firefox */
    .progress::-moz-range-track {
        height: 3px;
        background: #D2D2D2;
    }

    .progress::-moz-range-progress {
        height: 3px;
        background: #0878FF;
    }

    .progress::-moz-range-thumb {
        width: 17px;
        height: 17px;
        border: none;
        border-radius: 50%;
        background: #0878FF;
        cursor: grab;
    }

    .time {
        margin-top: 8px;
        text-align: center;
        color: #FFFFFF;
        font-size: 16px;
        line-height: 20px;
        font-weight: 400;
    }

    /* =========================================================
       NUEVO: ESTILOS PARA LOS BOTONES
       ========================================================= */
    .buttons-area {
        display: flex;
        justify-content: center; /* Centra los botones horizontalmente */
        align-items: center;
        gap: 15px; /* Espacio de separación entre los botones */
        margin-top: 25px; /* Separación con el tiempo del video */
        width: 100%;
    }

    .contact-btn {
        text-decoration: none;
        color: #FFFFFF;
        font-size: 15px;
        font-weight: bold;
        padding: 12px 0;
        border-radius: 25px; /* Bordes redondeados */
        text-align: center;
        flex: 1; /* Hace que ambos botones midan lo mismo */
        max-width: 160px; /* Ancho máximo para que no se estiren demasiado */
        transition: background 0.2s, transform 0.1s;
    }

    /* Efecto al presionar el botón */
    .contact-btn:active {
        transform: scale(0.95);
    }

    /* Colores específicos de cada botón */
    .btn-email {
        background: #0878FF; /* Gris oscuro elegante */
    }
    .btn-email:hover {
        background: #0063d1;
    }

    .btn-phone {
        background: #0878FF; /* Azul igual que la barra */
    }
    .btn-phone:hover {
        background: #0063d1;
    }

    @media (max-width: 360px) {
        body {
            padding-left: 16px;
            padding-right: 16px;
        }
        .buttons-area {
            gap: 10px; /* Menos espacio en pantallas muy pequeñas */
        }
    }
</style>
</head>

<body>

<div class="player">

    <div class="video-container" id="videoContainer">
        <!-- Colocá tu archivo como "video.mp4" en la misma carpeta que este HTML -->
        <video id="video" preload="metadata" playsinline>
            <source src="video.mp4" type="video/mp4">
            Tu navegador no puede reproducir este video.
        </video>
    </div>

    <div class="progress-area">
        <input
            type="range"
            id="progress"
            class="progress"
            min="0"
            max="100"
            value="0"
            step="0.1"
            aria-label="Barra de progreso del video"
        >

        <div class="time" id="time">0:00 / 0:00</div>
    </div>

    <!-- =========================================================
         NUEVO: ÁREA DE BOTONES DE CONTACTO
         ========================================================= -->
    <div class="buttons-area">
        <!-- Izquierda: Correo Electrónico (mailto:) -->
        <a href="mailto:tu-correo@ejemplo.com" class="contact-btn btn-email">Email</a>

        <!-- Derecha: Celular (tel:) -->
        <!-- Si prefieres que abra WhatsApp en vez de llamar, usa: href="https://wa.me/5491100000000" -->
        <a href="tel:+5491100000000" class="contact-btn btn-phone">Llamar</a>
    </div>

</div>

<script>
    const video = document.getElementById("video");
    const videoContainer = document.getElementById("videoContainer");
    const progress = document.getElementById("progress");
    const time = document.getElementById("time");

    // Reproducir / pausar al tocar o hacer clic sobre el video
    videoContainer.addEventListener("click", () => {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
    });

    // Actualizar la barra mientras se reproduce
    video.addEventListener("timeupdate", () => {
        if (!video.duration) return;

        const percentage = (video.currentTime / video.duration) * 100;
        progress.value = percentage;
        progress.style.setProperty("--progress", percentage + "%");

        updateTime();
    });

    // Permitir mover la barra a cualquier posición
    progress.addEventListener("input", () => {
        if (!video.duration) return;

        const newTime = (progress.value / 100) * video.duration;
        video.currentTime = newTime;

        progress.style.setProperty("--progress", progress.value + "%");
        updateTime();
    });

    // Mostrar duración cuando el video esté cargado
    video.addEventListener("loadedmetadata", () => {
        updateTime();
        progress.style.setProperty("--progress", "0%");
    });

    // Al finalizar vuelve a quedar en el final
    video.addEventListener("ended", () => {
        progress.value = 100;
        progress.style.setProperty("--progress", "100%");
        updateTime();
    });

    function formatTime(seconds) {
        if (!Number.isFinite(seconds)) return "0:00";

        seconds = Math.floor(seconds);

        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = seconds % 60;

        return minutes + ":" + String(remainingSeconds).padStart(2, "0");
    }

    function updateTime() {
        time.textContent =
            formatTime(video.currentTime) +
            " / " +
            formatTime(video.duration);
    }
</script>

</body>
</html>
